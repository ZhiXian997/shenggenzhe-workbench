<style>
  :root{
    --bg-main:#8BA4B8;
    --bg-main2:#9BB0C2;
    --bg-main3:#A8BAC9;
    --card-bg:#FBF8F5;
    --accent-pink:#F0D5C9;
    --divider:#D4C5B2;
    --accent-yellow:#F5E6D3;
    --text-main:#3D3D3D;
    --text-sub:#8A8A8A;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text-main);
    background:linear-gradient(160deg,var(--bg-main) 0%,var(--bg-main2) 60%,var(--bg-main3) 100%);
    background-attachment:fixed;
  }
  /* 深色模式 */
  body.dark{
    --bg-main:#2b333b;
    --bg-main2:#2b333b;
    --bg-main3:#2b333b;
    --card-bg:#3a424b;
    --accent-pink:#7d5b50;
    --divider:#534b40;
    --accent-yellow:#6b5d45;
    --text-main:#e8e2da;
    --text-sub:#a9a39b;
    background:linear-gradient(160deg,var(--bg-main) 0%,var(--bg-main2) 60%,var(--bg-main3) 100%);
  }
  .card{
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
  }
  .soft-shadow{box-shadow:0 2px 12px rgba(0,0,0,0.06);}
  .btn-primary{
    background:var(--accent-yellow);
    color:var(--text-main);
    border-radius:12px;
    transition:all .2s ease;
  }
  .btn-primary:hover{background:var(--accent-pink);transform:translateY(-1px);}
  .btn-ghost{
    background:transparent;color:var(--text-sub);
    border-radius:12px;transition:all .2s ease;
  }
  .btn-ghost:hover{background:var(--accent-yellow);color:var(--text-main);}
  .menu-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:12px;
    color:var(--text-main);cursor:pointer;
    transition:all .2s ease;position:relative;
    font-size:14px;
  }
  .menu-item:hover{background:var(--accent-yellow);}
  .menu-item.active{background:var(--accent-pink);font-weight:600;}
  .menu-item.active::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;
    background:var(--text-main);border-radius:2px;
  }
  .submenu{margin-left:18px;border-left:1px dashed var(--divider);padding-left:8px;}
  .submenu .menu-item{font-size:13px;padding:8px 12px;}
  input,textarea,select{
    background:var(--card-bg);color:var(--text-main);
    border:1px solid var(--divider);border-radius:10px;
    padding:8px 12px;outline:none;font-size:14px;width:100%;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent-pink);}
  .chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:999px;font-size:12px;
    background:var(--accent-yellow);color:var(--text-main);
  }
  .chip.pink{background:var(--accent-pink);}
  .chip.divider{background:var(--divider);}
  .view{animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .empty{
    text-align:center;padding:40px 20px;color:var(--text-sub);
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--divider);border-radius:8px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text-main);color:var(--card-bg);
    padding:10px 18px;border-radius:12px;font-size:13px;
    box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:9999;
    opacity:0;transition:opacity .25s ease,transform .25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;backdrop-filter:blur(2px);
  }
  .modal{
    background:var(--card-bg);border-radius:16px;
    padding:24px;width:90%;max-width:460px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
    animation:fade .2s ease;
  }
  .checkbox{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--divider);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all .2s ease;flex-shrink:0;
  }
  .checkbox.checked{background:var(--accent-pink);border-color:var(--accent-pink);}
  .checkbox.checked svg{color:var(--text-main);}
  .strike{text-decoration:line-through;color:var(--text-sub);}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s;
    position:relative;
  }
  .cal-day:hover{background:var(--accent-yellow);}
  .cal-day.today{background:var(--accent-pink);font-weight:700;}
  .cal-day.has{font-weight:600;}
  .cal-day.has::after{
    content:"";position:absolute;bottom:3px;width:4px;height:4px;
    border-radius:50%;background:var(--text-main);
  }
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .aspect-video{aspect-ratio:16/9;}
  .cal-day.other{color:var(--text-sub);opacity:.4;}
  .fab{
    position:fixed;right:28px;bottom:28px;width:56px;height:56px;
    border-radius:50%;background:var(--accent-pink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);cursor:pointer;z-index:50;
    transition:transform .2s ease;
  }
  .fab:hover{transform:scale(1.08) rotate(90deg);}
  .nav-scroll::-webkit-scrollbar{width:6px;}
  .graph-node{cursor:pointer;transition:all .2s;}
  .graph-node:hover{filter:brightness(1.1);}
  details summary{cursor:pointer;list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  .tag-filter{cursor:pointer;transition:all .15s;}
  .tag-filter.active{background:var(--accent-pink)!important;color:var(--text-main)!important;font-weight:600;}
  @media (max-width:768px){
    #sidebar{position:fixed;left:0;top:56px;bottom:0;width:240px;z-index:60;
      transform:translateX(-100%);transition:transform .25s ease;background:var(--card-bg);}
    #sidebar.open{transform:translateX(0);}
    #sidebarMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:55;top:56px;}
    #sidebarMask.show{display:block;}
  }
</style>
</head>

<script>

/* ---------- 数据层 ---------- */
const DS = {
  prefix:'sz_',
  queryAll(col){
    try{return JSON.parse(localStorage.getItem(this.prefix+col)||'[]');}catch(e){return [];}
  },
  setAll(col,items){localStorage.setItem(this.prefix+col,JSON.stringify(items));},
  load(col,id){return this.queryAll(col).find(i=>i.id===id);},
  save(col,data){
    if(!data.id) data.id='id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    if(!data.createdAt) data.createdAt=Date.now();
    data.updatedAt=Date.now();
    const items=this.queryAll(col);
    const idx=items.findIndex(i=>i.id===data.id);
    if(idx>=0) items[idx]=data; else items.push(data);
    this.setAll(col,items);
    return data;
  },
  delete(col,id){this.setAll(col,this.queryAll(col).filter(i=>i.id!==id));},
  query(col,filter){return this.queryAll(col).filter(filter);},
  clear(col){localStorage.removeItem(this.prefix+col);}
};

   dark:{bg1:'#1f2d36',bg2:'#273742',bg3:'#18232b',card:'#2a3842',accent:'#7EB5D0',yellow:'#3a4d59',divider:'#3a4d59',text:'#dce8ee',sub:'#859eab'}},

function applyTheme(themeId,isDark){
  const p=THEME_PRESETS.find(t=>t.id===themeId)||THEME_PRESETS[0];
  const t=isDark?p.dark:p;
  const root=document.documentElement;
  root.style.setProperty('--bg-main',t.bg1);
  root.style.setProperty('--bg-main2',t.bg2);
  root.style.setProperty('--bg-main3',t.bg3);
  root.style.setProperty('--card-bg',t.card);
  root.style.setProperty('--accent-pink',t.accent);
  root.style.setProperty('--accent-yellow',t.yellow);
  root.style.setProperty('--divider',t.divider);
  root.style.setProperty('--text-main',t.text);
  root.style.setProperty('--text-sub',t.sub);
  localStorage.setItem(DS.prefix+'themePreset',themeId);
  localStorage.setItem(DS.prefix+'theme',isDark?'dark':'light');
}

/* ---------- 工具函数 ---------- */
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const uid=()=>'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
const fmtDate=(ts)=>{const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日`;};
const fmtFull=(ts)=>{const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localISO=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysFromNow=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return localISO(d);};
const todayISO=()=>localISO(new Date());

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

/* ---------- 模态弹窗 ---------- */
function openModal(html){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-mask" id="modalMask"><div class="modal">${html}</div></div>`;
  lucide.createIcons();
  $('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask') closeModal();});
}
function closeModal(){$('#modalRoot').innerHTML='';}

function confirmDialog(title,msg,onYes,danger=true){
  openModal(`
    <h3 class="text-lg font-semibold mb-2">${esc(title)}</h3>
    <p class="text-sm mb-1" style="color:var(--text-sub);">${esc(msg)}</p>
    <p class="text-xs mb-5" style="color:#c47b6b;">⚠ 此操作不可撤销</p>
    <div class="flex gap-2 justify-end">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeModal()">取消</button>
      <button id="confirmYes" class="px-4 py-2 text-sm rounded-xl text-white" style="background:${danger?'#c47b6b':'var(--accent-pink)'};color:#fff;">确认</button>
    </div>`);
  $('#confirmYes').onclick=()=>{closeModal();onYes();};
}

function formModal(title,bodyHtml,onSave,okText='保存'){
  openModal(`
    <h3 class="text-lg font-semibold mb-4">${esc(title)}</h3>
    <div class="space-y-3 mb-5">${bodyHtml}</div>
    <div class="flex gap-2 justify-end">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeModal()">取消</button>
      <button id="formSave" class="btn-primary px-4 py-2 text-sm">${okText}</button>
    </div>`);
  $('#formSave').onclick=()=>{if(onSave()!==false) closeModal();};
}

/* ---------- 导航结构 ---------- */
const NAV=[
  {id:'dashboard',icon:'layout-dashboard',label:'仪表盘',emoji:'📊'},
  {id:'daily',icon:'sprout',label:'日常生活',emoji:'🌱',children:[

function renderNav(){
  const root=$('#navMenu');
  root.innerHTML=NAV.map(item=>{
    if(item.children){
      const open=openGroups[item.id];
      const childHtml=open?`<div class="submenu mt-1 flex flex-col gap-1">${
        item.children.map(c=>`<div class="menu-item ${currentView===c.id?'active':''}" data-view="${c.id}">${esc(c.label)}</div>`).join('')
      }</div>`:'';
      return `<div>
        <div class="menu-item" data-group="${item.id}">
          <i data-lucide="${item.icon}" class="w-4 h-4"></i>
          <span class="flex-1">${item.emoji} ${esc(item.label)}</span>
          <i data-lucide="${open?'chevron-down':'chevron-right'}" class="w-4 h-4"></i>
        </div>${childHtml}</div>`;
    }
    return `<div class="menu-item ${currentView===item.id?'active':''}" data-view="${item.id}">
      <i data-lucide="${item.icon}" class="w-4 h-4"></i>
      <span>${item.emoji} ${esc(item.label)}</span></div>`;
  }).join('');
  lucide.createIcons();
  $$('#navMenu [data-view]').forEach(el=>el.onclick=()=>{
    currentView=el.dataset.view;
    if(PARENT_OF[currentView]) openGroups[PARENT_OF[currentView]]=true;
    renderNav();render();closeSidebarMobile();
  });
  $$('#navMenu [data-group]').forEach(el=>el.onclick=()=>{
    openGroups[el.dataset.group]=!openGroups[el.dataset.group];
    renderNav();
  });
}

function closeSidebarMobile(){

  const sched=DS.queryAll('schedules').filter(s=>s.status==='待发布').sort((a,b)=>a.date.localeCompare(b.date));

    </div>
  </div>`;

function progressBar(label,a,b){
  const p=b===0?0:Math.round(a/b*100);
  return `<div class="mb-3">
    <div class="flex justify-between text-xs mb-1"><span>${label}</span><span style="color:var(--text-sub);">${a}/${b}</span></div>
    <div class="h-2 rounded-full" style="background:var(--divider);">
      <div class="h-2 rounded-full transition-all" style="width:${p}%;background:var(--accent-pink);"></div>
    </div>
  </div>`;
}

  toast('已添加打卡项');render();

  const doneTools=tools.filter(t=>t.done).length;
  const stages=[
    {name:'工具实操',desc:`已完成 ${doneTools}/${tools.length} 个工具`,active:true},
    {name:'术语穿插',desc:`已掌握 ${learnedTerms.length}/${terms.length} 个术语`,active:learnedTerms.length>0},
    {name:'周期复习',desc:`今日待复习 ${dueReviews.length} 个`,active:dueReviews.length>0},
    {name:'系统认知',desc:`积累 ${learnedTerms.length} 知识点，查看图谱`,active:learnedTerms.length>=3}

        <div class="space-y-3">${tools.map(t=>`
          <div class="p-4 rounded-xl ${t.unlocked?'':'opacity-50'}" style="background:var(--accent-yellow);">
            <div class="flex items-center justify-between mb-1">
              <div class="font-medium text-sm">${esc(t.name)}</div>
              ${t.done?`<span class="chip pink text-xs">已完成</span>`:`<span class="chip text-xs">${t.unlocked?'进行中':'未解锁'}</span>`}
            </div>
            <div class="text-xs mb-2" style="color:var(--text-sub);">${esc(t.intro)}</div>
            <div class="text-sm mb-3">📋 ${esc(t.task)}</div>
            <div class="flex items-center gap-2">
              <div class="checkbox ${t.done?'checked':''}" data-tool="${t.id}" ${t.unlocked?'':'disabled'}>${t.done?'<i data-lucide="check" class="w-3 h-3"></i>':''}</div>
              <span class="text-xs">${t.done?'已完成上手任务':'标记完成可解锁下一工具'}</span>
            </div>
          </div>`).join('')}</div>
      </div>
      <!-- 术语小卡片 -->
      <div class="card p-5">
        <h3 class="font-semibold mb-3">你知道吗？· AI术语</h3>
        <div class="space-y-2 max-h-[600px] overflow-y-auto">
          ${terms.map(t=>`<details class="p-3 rounded-xl" style="background:var(--accent-yellow);">
            <summary class="flex items-center justify-between text-sm">
              <span class="font-medium">${esc(t.name)}</span>
              <span class="text-xs" style="color:var(--text-sub);">${t.learned?'✓已学':'未学'}</span>
            </summary>
            <div class="mt-2 text-xs space-y-2">
              <div>${esc(t.explain)}</div>
              <div class="p-2 rounded-lg" style="background:var(--card-bg);">💡 ${esc(t.analogy)}</div>
              ${!t.learned?`<button class="btn-ghost text-xs px-2 py-1" onclick="markTermLearned('${t.id}')">标记为已掌握</button>`:
                `<button class="btn-ghost text-xs px-2 py-1" onclick="resetTerm('${t.id}')">重新学习</button>`}
            </div>
          </details>`).join('')}
        </div>

};
views.ai_bind=()=>{
  $$('[data-tool]').forEach(el=>el.onclick=()=>{
    if(el.hasAttribute('disabled')) return;
    const id=el.dataset.tool;
    const t=DS.load('aiTools',id);
    t.done=!t.done;
    DS.save('aiTools',t);
    if(t.done){
      // 解锁下一个
      const tools=DS.queryAll('aiTools').sort((a,b)=>a.order-b.order);
      const idx=tools.findIndex(x=>x.id===id);
      if(idx>=0&&idx+1<tools.length){tools[idx+1].unlocked=true;DS.save('aiTools',tools[idx+1]);}
    }
    render();
  });
};
function markTermLearned(id){
  const t=DS.load('aiTerms',id);
  t.learned=true;t.reviewCount=1;t.nextReview=daysFromNow(1);
  DS.save('aiTerms',t);toast('已标记，1天后复习');render();
}
function resetTerm(id){
  const t=DS.load('aiTerms',id);
  t.learned=false;t.reviewCount=0;t.nextReview=null;
  DS.save('aiTerms',t);render();
}
function startReview(){
  const today=todayISO();
  const due=DS.query('aiTerms',t=>t.learned&&t.nextReview&&t.nextReview<=today);
  if(!due.length){toast('没有需要复习的');return;}
  let i=0;
  const showOne=()=>{
    if(i>=due.length){closeModal();toast('复习完成，棒！');render();return;}
    const t=due[i];
    openModal(`<div class="text-center">
      <div class="text-xs mb-2" style="color:var(--text-sub);">还记得这个吗？(${i+1}/${due.length})</div>
      <h3 class="text-xl font-bold mb-4">${esc(t.name)}</h3>
      <div class="flex gap-2 justify-center">
        <button class="btn-ghost px-4 py-2 text-sm" onclick="showReviewDetail()">再看一遍</button>
        <button class="btn-primary px-4 py-2 text-sm" onclick="rememberTerm('${t.id}')">我记得</button>
      </div>
    </div>`);
    window._curReviewTerm=t;window._reviewNext=()=>{i++;showOne();};
  };
  showOne();
}
function showReviewDetail(){
  const t=window._curReviewTerm;
  openModal(`<div>
    <h3 class="text-lg font-bold mb-2">${esc(t.name)}</h3>
    <div class="text-sm mb-3">${esc(t.explain)}</div>
    <div class="p-3 rounded-xl text-sm" style="background:var(--accent-yellow);">💡 ${esc(t.analogy)}</div>
    <div class="flex gap-2 justify-end mt-4">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="window._reviewNext()">下一个</button>
      <button class="btn-primary px-4 py-2 text-sm" onclick="rememberTerm('${t.id}',true)">我记得</button>
    </div></div>`);
}
function rememberTerm(id,fromDetail){
  const t=DS.load('aiTerms',id);
  t.reviewCount=(t.reviewCount||0)+1;
  const intervals=[1,3,7,15,30];
  const idx=Math.min(t.reviewCount,intervals.length-1);
  t.nextReview=daysFromNow(intervals[idx]);
  DS.save('aiTerms',t);
  if(fromDetail) window._reviewNext();
  else window._reviewNext();
}
function openGraph(){
  const terms=DS.query('aiTerms').filter(t=>t.learned);
  const tools=DS.queryAll('aiTools').filter(t=>t.done);
  if(terms.length<1&&tools.length<1){toast('先完成一些学习再来吧');return;}
  // 简单图谱：中心节点 + 周围节点
  const cx=300,cy=220,r=150;
  const nodes=[
    {id:'root',label:'我的AI知识体系',x:cx,y:cy,type:'root'},
    ...tools.map((t,i)=>{const a=(i/Math.max(tools.length,1))*Math.PI*2;return {id:t.id,label:t.name,x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,type:'tool'};}),
    ...terms.map((t,i)=>{const a=(i/Math.max(terms.length,1))*Math.PI*2+Math.PI;return {id:t.id,label:t.name,x:cx+Math.cos(a)*(r+60),y:cy+Math.sin(a)*(r+60),type:'term'};})
  ];
  const links=nodes.filter(n=>n.id!=='root').map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="#D4C5B2" stroke-width="1.5"/>`).join('');
  const circles=nodes.map(n=>{
    const fill=n.type==='root'?'#F0D5C9':n.type==='tool'?'#F5E6D3':'#FBF8F5';
    const stroke=n.type==='root'?'#8BA4B8':'#D4C5B2';
    return `<g class="graph-node" onclick="graphClick('${n.id}','${n.type}')">
      <circle cx="${n.x}" cy="${n.y}" r="${n.type==='root'?28:22}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="10" fill="#3D3D3D">${esc(n.label.length>6?n.label.slice(0,5)+'..':n.label)}</text>
    </g>`;
  }).join('');
  openModal(`<div>
    <h3 class="text-lg font-semibold mb-1">AI 知识体系图谱</h3>
    <p class="text-xs mb-3" style="color:var(--text-sub);">点击节点查看详情 · 随学习动态更新</p>
    <svg viewBox="0 0 600 440" class="w-full">${links}${circles}</svg>
    <div class="flex gap-2 justify-end mt-3">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeModal()">关闭</button>
    </div></div>`);
}
function graphClick(id,type){
  if(id==='root'){toast('这是你的知识体系中心');return;}
  const item=DS.load(type==='tool'?'aiTools':'aiTerms',id);
  if(!item) return;
  openModal(`<div>
    <h3 class="text-lg font-bold mb-2">${esc(item.name)}</h3>
    ${type==='tool'?`<div class="text-sm mb-2">${esc(item.intro)}</div><div class="text-sm p-3 rounded-xl" style="background:var(--accent-yellow);">📋 ${esc(item.task)}</div>`:
    `<div class="text-sm mb-2">${esc(item.explain)}</div><div class="p-3 rounded-xl text-sm" style="background:var(--accent-yellow);">💡 ${esc(item.analogy)}</div>`}
    <button class="btn-ghost mt-4 px-4 py-2 text-sm" onclick="openGraph()">返回图谱</button>
  </div>`);
}

function saveTermToKB(term){

function importAllTodayKB(){

function syncFromEconKB(){
  const kb=window.ECON_KB||{byDate:{}};
  const allDates=Object.keys(kb.byDate||{});
  let add=0;
  for(const d of allDates){
    const pts=kb.byDate[d]?.points||[];
    for(const p of pts){
      if(!DS.queryAll('econKB').find(x=>x.term===p.term)){
        DS.save('econKB',{term:p.term,definition:p.definition,impact:p.impact,category:p.category,example:p.example,source:`sync-${d}`,date:d,learned:false});
        add++;
      }
    }
  }
  toast(`同步完成：新增 ${add} 条（共 ${allDates.length} 天）`);
  render();
}

  const kb=window.ECON_KB||{byDate:{}};

function playVideo(url,title,type){
  const el=document.getElementById('videoPlayer');
  if(!el) return;
  el.style.background='#000';
  el.style.display='block';
  el.innerHTML=`<iframe src="${url}" class="w-full h-full rounded-xl" frameborder="0" allowfullscreen allow="autoplay"></iframe>`;
  // 自动记录到素材库
  const existing=DS.queryAll('english').find(m=>m.source===url);
  if(!existing){
    DS.save('english',{type:type,title:title,source:url,note:'B站嵌入播放器链接',shadowMinutes:0});
  }
  lucide.createIcons();
}
function markShadow(bvid,title,type){
  const existing=DS.queryAll('english').find(m=>m.source&&m.source.includes(bvid));
  if(existing){
    existing.shadowMinutes=(existing.shadowMinutes||0)+5;
    DS.save('english',existing);
  }else{
    DS.save('english',{type:type,title:title,source:'bvid:'+bvid,note:'B站视频',shadowMinutes:5});
  }
  toast('跟读 +5min，加油！');render();
}

  formModal('添加英语素材',`
    <div><label class="text-xs">类型</label><select id="eg_type"><option>TED</option><option>邹韵</option><option>其他</option></select></div>
    <div><label class="text-xs">标题</label><input id="eg_title" placeholder="如：如何掌控你的自由时间"></div>
    <div><label class="text-xs">来源/链接</label><input id="eg_source" placeholder="视频链接或来源"></div>
    <div><label class="text-xs">文字稿/笔记</label><textarea id="eg_note" rows="3"></textarea></div>

function editEng(id){

/* ---------- 内容排期 ---------- */
views.schedule=()=>{
  const list=DS.queryAll('schedules');
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  let cells='';
  const byDate={};
  list.forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s);});
  for(let i=0;i<firstDay;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=byDate[ds]||[];
    cells+=`<div class="cal-day ${ds===todayISO()?'today':''} ${items.length?'has':''}" data-date="${ds}">${d}
      ${items.length?`<div class="text-[10px] mt-0.5 leading-tight">${items.map(s=>esc(s.title.slice(0,4))).join(' ')}</div>`:''}
    </div>`;
  }
  return `
  <div class="view">
    <div class="flex items-center justify-between mb-4">
      <div><h1 class="text-2xl font-bold">内容排期</h1>
      <p class="text-sm" style="color:var(--text-sub);">有节奏地发布，不被算法推着走</p></div>
      <button class="btn-primary px-4 py-2 text-sm" onclick="addSchedule()">+ 新增排期</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card p-5">
        <h3 class="font-semibold mb-3">${y}年${m+1}月</h3>
        <div class="grid grid-cols-7 gap-1 text-center text-xs mb-1" style="color:var(--text-sub);">${['日','一','二','三','四','五','六'].map(w=>`<div>${w}</div>`).join('')}</div>
        <div class="grid grid-cols-7 gap-1">${cells}</div>
      </div>
      <div class="card p-5">
        <h3 class="font-semibold mb-3">所有排期</h3>
        ${list.length===0?`<div class="empty">还没有排期内容</div>`:
          `<div class="space-y-2 max-h-[480px] overflow-y-auto">${list.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`
            <div class="p-3 rounded-xl" style="background:var(--accent-yellow);">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs" style="color:var(--text-sub);">${s.date}</span>
                <span class="chip ${s.status==='已发布'?'':'pink'} text-xs">${esc(s.status)}</span>
              </div>
              <div class="font-medium text-sm mb-1">${esc(s.title)}</div>
              <div class="flex items-center justify-between">
                <span class="chip text-xs">${esc(s.platform)}</span>
                <div class="flex gap-1">
                  <button class="btn-ghost text-xs px-1 py-0.5" onclick="toggleSchedStatus('${s.id}')">切换状态</button>
                  <button class="btn-ghost text-xs px-1 py-0.5" onclick="editSchedule('${s.id}')"><i data-lucide="pencil" class="w-3 h-3"></i></button>
                  <button class="btn-ghost text-xs px-1 py-0.5" onclick="delSchedule('${s.id}')"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                </div>
              </div>
            </div>`).join('')}</div>`}
      </div>
    </div>
  </div>`;
};
views.schedule_bind=()=>{
  $$('.cal-day[data-date]').forEach(el=>el.onclick=()=>{
    const d=el.dataset.date;
    addSchedule(d);
  });
};
function addSchedule(presetDate){
  const d=presetDate||todayISO();
  formModal('新增排期',`
    <div><label class="text-xs">标题</label><input id="sc_title" placeholder="内容标题"></div>
    <div class="grid grid-cols-2 gap-2">

/* ---------- 数据看板 ---------- */
views.databoard=()=>{
  const list=DS.queryAll('dataRecords').sort((a,b)=>a.date.localeCompare(b.date));
  const maxPlay=list.length?Math.max(...list.map(r=>r.views||0)):1;
  return `
  <div class="view">
    <div class="flex items-center justify-between mb-4">
      <div><h1 class="text-2xl font-bold">数据看板</h1>
      <p class="text-sm" style="color:var(--text-sub);">手动录入，看见自己的成长曲线</p></div>
      <button class="btn-primary px-4 py-2 text-sm" onclick="addData()">+ 录入数据</button>
    </div>
    ${list.length===0?`<div class="card p-5 empty">还没有数据，录入第一期开始追踪吧</div>`:`
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        ${statCard('总播放',list.reduce((s,r)=>s+(r.views||0),0))}
        ${statCard('总点赞',list.reduce((s,r)=>s+(r.likes||0),0))}
        ${statCard('总评论',list.reduce((s,r)=>s+(r.comments||0),0))}
        ${statCard('总收藏',list.reduce((s,r)=>s+(r.favorites||0),0))}
      </div>
      <div class="card p-5 mb-4">
        <h3 class="font-semibold mb-3">播放量趋势</h3>
        <div class="flex items-end gap-2 h-40">
          ${list.map(r=>{const h=Math.max(8,Math.round((r.views||0)/maxPlay*100));return `
            <div class="flex-1 flex flex-col items-center justify-end" title="${r.date}: ${r.views||0}">
              <div class="w-full rounded-t-lg transition-all" style="height:${h}%;background:var(--accent-pink);min-height:8px;"></div>
              <div class="text-[10px] mt-1" style="color:var(--text-sub);">${r.date.slice(5)}</div>
            </div>`;}).join('')}
        </div>
      </div>
      <div class="card p-5">
        <h3 class="font-semibold mb-3">明细</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr style="color:var(--text-sub);"><th class="text-left p-2">日期</th><th class="text-left p-2">标题</th><th class="p-2">播放</th><th class="p-2">点赞</th><th class="p-2">评论</th><th class="p-2">收藏</th><th></th></tr></thead>
            <tbody>${list.map(r=>`<tr class="border-t" style="border-color:var(--divider);">
              <td class="p-2">${r.date}</td><td class="p-2">${esc(r.title)}</td>
              <td class="p-2 text-center">${r.views||0}</td><td class="p-2 text-center">${r.likes||0}</td>
              <td class="p-2 text-center">${r.comments||0}</td><td class="p-2 text-center">${r.favorites||0}</td>
              <td class="p-2"><button class="btn-ghost text-xs px-1 py-0.5" onclick="delData('${r.id}')"><i data-lucide="trash-2" class="w-3 h-3"></i></button></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`}
  </div>`;
};
function statCard(label,val){
  return `<div class="card p-4"><div class="text-xs mb-1" style="color:var(--text-sub);">${label}</div><div class="text-xl font-bold">${val}</div></div>`;
}
function addData(){

    <div><label class="text-xs">日期</label><input id="db_date" type="date" value="${todayISO()}"></div>

function delData(id){confirmDialog('删除数据','删除这条数据记录？',()=>{DS.delete('dataRecords',id);toast('已删除');render();});}

function exportData(){
  const cols=['checkins','checkinRecords','reflection','aiTools','aiTerms','economy','english','vocab','sentences','tags','hotspots','inspirations','schedules','dataRecords','todos','ecoNews'];
  const data={_app:'生根者工作台',_version:1,_exportAt:new Date().toISOString()};
  cols.forEach(c=>data[c]=DS.queryAll(c));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`生根者工作台-备份-${todayISO()}.json`;
  a.click();
  toast('已导出备份文件');
}
function importData(){
  const f=$('#importFile').files[0];
  if(!f){toast('请先选择文件');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      confirmDialog('导入数据','导入将覆盖当前所有数据，建议先导出备份。确定继续？',()=>{
        Object.keys(data).forEach(k=>{if(!k.startsWith('_')) DS.setAll(k,data[k]);});
        toast('导入成功');render();
      });
    }catch(err){toast('文件格式错误');}
  };
  reader.readAsText(f);
}
function toggleTheme(){
  const isDark=document.body.classList.contains('dark');
  const newDark=!isDark;
  if(newDark) document.body.classList.add('dark'); else document.body.classList.remove('dark');
  const presetId=localStorage.getItem(DS.prefix+'themePreset')||'original';
  applyTheme(presetId,newDark);
  // 触发一次视图重新渲染但保留滚动位置
  const scrollY=window.scrollY;
  render();
  window.scrollTo(0,scrollY);
}
function pickPreset(id){
  const isDark=document.body.classList.contains('dark');
  applyTheme(id,isDark);
  render();
  toast(`已切换为「${THEME_PRESETS.find(t=>t.id===id)?.name}」`);
}
function customColor(key,val){
  document.documentElement.style.setProperty(key,val);
}
function saveCustomTheme(){
  toast('自定义配色已保存');
}
function resetTheme(){
  applyTheme('original',document.body.classList.contains('dark'));
  render();
  toast('已恢复默认主题');
}
function openCustomColors(){
  const vars=[
    {key:'--bg-main',label:'背景主色'},{key:'--bg-main2',label:'背景次色'},
    {key:'--bg-main3',label:'背景辅色'},{key:'--card-bg',label:'卡片底色'},
    {key:'--accent-pink',label:'主强调色'},{key:'--accent-yellow',label:'次强调色'},
    {key:'--divider',label:'分隔线色'},{key:'--text-main',label:'主文字色'},
    {key:'--text-sub',label:'次文字色'}
  ];
  const root=document.documentElement;
  let inputs='';
  vars.forEach(v=>{
    const cur=getComputedStyle(root).getPropertyValue(v.key).trim();
    inputs+=`<div class="flex items-center gap-2 mb-2">
      <label class="flex-1 text-xs">${v.label}</label>
      <input type="color" value="${cur}" onchange="customColor('${v.key}',this.value)" style="width:36px;height:32px;border:none;cursor:pointer;background:none;">
      <span class="text-xs font-mono" style="color:var(--text-sub);min-width:70px;">${cur}</span>
    </div>`;
  });
  openModal(`<h3 class="text-lg font-semibold mb-4">自定义配色</h3>
    <p class="text-xs mb-3" style="color:var(--text-sub);">可自由调整9个颜色变量，所有更改即时生效。</p>
    <div class="grid grid-cols-1 gap-1">${inputs}</div>
    <div class="flex gap-2 justify-end mt-4">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeModal(); resetTheme()">恢复预设</button>
      <button class="btn-primary px-4 py-2 text-sm" onclick="closeModal()">完成</button>
    </div>`);
}
function resetAll(){

/* ---------- 全局搜索 ---------- */
function doSearch(kw){
  kw=kw.trim();if(!kw) return;
  const results=[];
  DS.queryAll('inspirations').filter(i=>i.content.includes(kw)).forEach(i=>results.push({type:'灵感',text:i.content,view:'inspiration'}));
  DS.queryAll('hotspots').filter(h=>h.title.includes(kw)).forEach(h=>results.push({type:'热点',text:h.title,view:'hotspot'}));
  DS.queryAll('checkins').filter(c=>c.name.includes(kw)).forEach(c=>results.push({type:'打卡项',text:c.name,view:'today'}));
  DS.queryAll('reflection').filter(r=>r.content.includes(kw)).forEach(r=>results.push({type:'感悟',text:r.content,view:'reflection'}));
  DS.queryAll('aiTerms').filter(t=>t.name.includes(kw)||t.explain.includes(kw)).forEach(t=>results.push({type:'AI术语',text:t.name,view:'ai'}));
  DS.queryAll('economy').filter(e=>e.topic.includes(kw)).forEach(e=>results.push({type:'经济',text:e.topic,view:'economy'}));
  if(!results.length){toast('没有找到相关内容');return;}
  openModal(`<h3 class="text-lg font-semibold mb-3">搜索结果（${results.length}）</h3>
    <div class="space-y-2 max-h-96 overflow-y-auto">${results.slice(0,30).map(r=>`
      <div class="p-3 rounded-xl cursor-pointer" style="background:var(--accent-yellow);" onclick="closeModal();goView('${r.view}')">
        <span class="chip text-xs mb-1">${r.type}</span>
        <div class="text-sm mt-1">${esc(r.text.slice(0,60))}</div>
      </div>`).join('')}</div>
      <button class="btn-ghost mt-4 px-4 py-2 text-sm" onclick="closeModal()">关闭</button>`);
}

/* ---------- 初始化 ---------- */
function init(){
  seedData();
  // 主题（先移除所有 dark class，再根据保存的状态和预设应用）
  document.body.classList.remove('dark');
  const savedPreset=localStorage.getItem(DS.prefix+'themePreset')||'original';
  const savedTheme=localStorage.getItem(DS.prefix+'theme')||'light';
  if(savedTheme==='dark') document.body.classList.add('dark');
  applyTheme(savedPreset,document.body.classList.contains('dark'));
  renderNav();
  render();
  // 事件绑定
  $('#fab').onclick=openQuickAdd;
  $('#settingsBtn').onclick=()=>goView('settings');
  $('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(e.target.value);});
  $('#menuToggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('#sidebarMask').classList.toggle('show');};
  $('#sidebarMask').onclick=()=>{$('#sidebar').classList.remove('open');$('#sidebarMask').classList.remove('show');};
  // 主题图标
  const updateThemeIcon=()=>{
    const icon=document.body.classList.contains('dark')?'sun':'moon';
    $('#themeToggle').innerHTML=`<i data-lucide="${icon}" class="w-5 h-5"></i>`;
    lucide.createIcons();
  };
  updateThemeIcon();
  const _toggle=toggleTheme;
  toggleTheme=function(){_toggle();updateThemeIcon();};
  $('#themeToggle').onclick=toggleTheme;
}
init();
