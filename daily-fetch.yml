name: 每日新闻抓取

on:
  schedule:
    # 北京时间9:00 = UTC 1:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行抓取脚本
        run: node fetch_news.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.js econ_kb.js
          git diff --staged --quiet || git commit -m "📡 每日自动抓取 [$(date +'%Y-%m-%d')]"
          git push